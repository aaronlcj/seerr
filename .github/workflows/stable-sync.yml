
name: Stable Sync and Docker Publish

on:
  push:
    branches: [stable]
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:

concurrency:
  group: seerr-stable
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  actions: write
  
jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Get latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/seerr-team/seerr/releases/latest --jq '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rebase onto latest release
        id: sync
        env:
          LATEST_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch upstream "refs/tags/${LATEST_TAG}:refs/tags/${LATEST_TAG}"

          BEFORE=$(git rev-parse HEAD)

          if ! git rebase "$LATEST_TAG" > /tmp/rebase.log 2>&1; then
            CONFLICTS=$(git diff --name-only --diff-filter=U || true)
            LOG=$(tail -n 40 /tmp/rebase.log)
            git rebase --abort || true

            {
              echo "conflict=true"
              echo "publish=false"
              echo "details<<DETAILS_EOF"
              echo "Target release: $LATEST_TAG"
              echo "Conflicting files:"
              echo "$CONFLICTS"
              echo ""
              echo "$LOG"
              echo "DETAILS_EOF"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          AFTER=$(git rev-parse HEAD)

          if [ "$AFTER" != "$BEFORE" ]; then
            if ! git push --force-with-lease origin HEAD:refs/heads/stable > /tmp/push.log 2>&1; then
              {
                echo "conflict=true"
                echo "publish=false"
                echo "details<<DETAILS_EOF"
                cat /tmp/push.log
                echo "DETAILS_EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PUBLISH=false

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] || \
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$AFTER" != "$BEFORE" ]]; then
            PUBLISH=true
          fi

          {
            echo "conflict=false"
            echo "publish=$PUBLISH"
            echo "sha=$AFTER"
          } >> "$GITHUB_OUTPUT"

      - name: Notify on conflict
        if: steps.sync.outputs.conflict == 'true'
        uses: actions/github-script@v7
        env:
          DETAILS: ${{ steps.sync.outputs.details }}
        with:
          script: |
            const title = '[Seerr stable sync] Rebase needs attention';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              i => !i.pull_request && i.title === title
            );

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                assignees: [context.repo.owner],
                body: [
                  'Automated upstream rebase failed.',
                  '',
                  `Target release: ${process.env.DETAILS}`,
                  '',
                  `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Resolve the conflict on the stable branch and rerun the workflow.'
                ].join('\n')
              });
            }

      - name: Close resolved conflict notification
        if: steps.sync.outputs.conflict != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Seerr stable sync] Rebase needs attention';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(
              i => !i.pull_request && i.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Upstream sync succeeded. Closing this issue.'
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Set image name
        if: steps.sync.outputs.conflict != 'true' && steps.sync.outputs.publish == 'true'
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.sync.outputs.conflict != 'true' && steps.sync.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.sync.outputs.conflict != 'true' && steps.sync.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: steps.sync.outputs.conflict != 'true' && steps.sync.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ steps.sync.outputs.sha }}
          build-args: |
            COMMIT_TAG=${{ steps.sync.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail workflow on conflict
        if: steps.sync.outputs.conflict == 'true'
        run: exit 1
